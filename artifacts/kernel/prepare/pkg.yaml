name: kernel-prepare
variant: scratch
shell: /bin/bash
dependencies:
  - image: '{{ .TOOLS_IMAGE }}'
steps:
  - sources:
      - url: https://cdn.kernel.org/pub/linux/kernel/v{{ regexReplaceAll ".\\d+\\.\\d+$" .linux_version "${1}" }}.x/linux-{{ .linux_version }}.tar.xz
        destination: linux.tar.xz
        sha256: "{{ .linux_sha256 }}"
        sha512: "{{ .linux_sha512 }}"
    env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
    prepare:
      - |
        mkdir -p /src
        tar -xJf linux.tar.xz --strip-components=1 -C /src
        rm linux.tar.xz
        cd /src
        make mrproper
finalize:
  - from: /
    to: /
