name: kernel-rpi-prepare
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/raspberrypi/linux/archive/{{ .linux_rpi_ref }}.tar.gz
        destination: linux_rpi.tar.gz
        sha256: "{{ .linux_rpi_sha256 }}"
        sha512: "{{ .linux_rpi_sha512 }}"
    env:
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86_64{{ else }}unsupported{{ end }}
    prepare:
      - |
        mkdir -p /src
        tar -xzf linux_rpi.tar.gz --strip-components=1 -C /src
        rm linux_rpi.tar.gz
      
        cd /src
        make mrproper
    install:
      - |
        mkdir -p /src
        cp -a . /src/

finalize:
  - from: /
    to: /